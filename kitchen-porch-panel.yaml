---
# Hardware: Sonoff NSPanel US portrait (NSPanel-USW), ESP32-D0WD-V3, 4MB flash
# Mac Address: c0:49:ef:d1:ee:50
# Location: kitchen, controls the kitchen porch light (relay 1).
# Stock firmware backup (eWeLink v2.03.11):
#   ~/Documents/nspanel/nspanel-usw-stock-c049efd1ee50.bin
# Firmware is the NSPanel HA Blueprint (Blackymas). Button/relay behaviour,
# display model (US portrait) and pages are configured from the HA blueprint
# automation, not here. Don't include common/wifi.yaml: the blueprint defines
# its own wifi network list, api and ota entries.
substitutions:
  name: kitchen-porch-panel
  device_name: kitchen-porch-panel
  friendly_name: Kitchen Porch Panel
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  boot_sound: "false"
  upload_tft_automatically: "true"

api:
  encryption:
    key: !secret api_key

wifi:
  domain: !secret wifi_domain
  ap:
    ssid: "${friendly_name} ESP"
    password: !secret fallback_password

captive_portal:

packages:
  remote_package:
    url: https://github.com/Blackymas/NSPanel_HA_Blueprint
    # main: v2026031 doesn't build on ESPHome >= 2026.4 (ntc raw_state removed).
    # Move back to a release tag once one newer than v2026031 ships.
    ref: 05ecefde2bac5db8bc96c02148058518d78a06fb
    refresh: 1d
    files:
      - nspanel_esphome.yaml

# ESPHome Security Pre-commit Configuration
# Streamlined security hooks for single-user repository

repos:
  # Essential secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect hardcoded secrets
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            \.gitsecrets|
            \.github/workflows/security-scan\.yml
          )$

  # Basic YAML validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: YAML Lint
        args: ['-d', 'relaxed']
        files: \.(yaml|yml)$

  # Markdown validation
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        name: Markdown Lint
        args: ['--config', '.markdownlint.json']
        files: \.md$

  # Essential security checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-yaml
        # --unsafe checks syntax only, so ESPHome tags (!secret, !include,
        # !lambda) don't fail the hook.
        args: ['--unsafe']
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            \.esphome/.*|
            build/.*|
            fonts/.*\.ttf
          )$
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            \.esphome/.*|
            build/.*|
            fonts/.*\.ttf
          )$

# Global configuration
default_stages: [pre-commit]
# nodeenv otherwise installs the newest Node release, which can be an
# unparseable pre-release (27.0.0-alpha broke markdownlint outside the
# nix dev shell).
default_language_version:
  node: lts
fail_fast: false
minimum_pre_commit_version: '3.0.0'

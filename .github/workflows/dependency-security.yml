name: Dependency Security

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'pyproject.toml'
      - 'renovate.json'
      - '.github/workflows/dependency-security.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'pyproject.toml'
      - 'renovate.json'
      - '.github/workflows/dependency-security.yml'
  schedule:
    # Run weekly on Mondays at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'

jobs:
  python-security:
    name: Python Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Resolve project dependencies
      run: |
        # uv.lock is not committed, so this resolves the latest versions that
        # pyproject.toml (and esphome's own pins) allow.
        uv export --no-hashes --no-emit-project --format requirements-txt > audit-requirements.txt
        echo "Resolved $(grep -c '==' audit-requirements.txt) packages"

    - name: Run vulnerability scan
      run: |
        echo "Running Python dependency vulnerability scan..."
        pip install pip-audit

        # pip-audit exits non-zero both for findings and for tool errors, so
        # judge the result from the JSON report instead.
        pip-audit -r audit-requirements.txt --disable-pip --no-deps \
          -f json -o pip-audit.json || true

        # Anything still vulnerable after a fresh resolve is held back by an
        # upstream pin (esphome pins exact versions), which only an esphome
        # bump can fix. Report findings as warnings rather than failing.
        python - <<'PY'
        import json, os, sys

        try:
            with open("pip-audit.json") as f:
                report = json.load(f)
        except (OSError, ValueError) as e:
            print(f"::error::pip-audit did not produce a report: {e}")
            sys.exit(1)

        vulnerable = [d for d in report["dependencies"] if d.get("vulns")]
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write("## Python dependency audit\n\n")
            if not vulnerable:
                summary.write("No known vulnerabilities.\n")
                print("✅ pip-audit found no known vulnerabilities")
            else:
                summary.write("| Package | Version | Advisories | Fixed in |\n|---|---|---|---|\n")
            for d in vulnerable:
                fixes = sorted({v for vuln in d["vulns"] for v in vuln["fix_versions"]})
                fixed_in = ", ".join(fixes) or "none"
                summary.write(f"| {d['name']} | {d['version']} | {len(d['vulns'])} | {fixed_in} |\n")
                print(
                    f"::warning title=Vulnerable dependency::{d['name']} {d['version']} has "
                    f"{len(d['vulns'])} known advisories (fixed in {fixed_in}); "
                    "held back by an upstream pin"
                )
        PY

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Dependency Review
      uses: actions/dependency-review-action@v5.0.0
      with:
        fail-on-severity: moderate
        allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, GPL-3.0

  renovate-check:
    name: Renovate Configuration
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate Renovate configuration
      run: |
        echo "Checking Renovate configuration..."

        if [ -f renovate.json ]; then
          echo "✅ Renovate configuration found"

          # Basic validation
          if jq empty renovate.json; then
            echo "✅ Renovate JSON is valid"
          else
            echo "❌ Renovate JSON is invalid"
            exit 1
          fi

          # Check for security settings
          if jq -e '.vulnerabilityAlerts' renovate.json >/dev/null 2>&1; then
            echo "✅ Vulnerability alerts configured"
          else
            echo "ℹ️ Consider enabling vulnerability alerts"
          fi
        else
          echo "⚠️ No renovate.json found - automated dependency updates not configured"
        fi

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [python-security, renovate-check]
    if: always()

    steps:
    - name: Generate summary
      run: |
        echo "## 🔒 Dependency Security Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.python-security.result }}" == "success" ]; then
          echo "✅ **Python Dependencies**: Audited (see warnings for pinned vulnerabilities)" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.python-security.result }}" == "failure" ]; then
          echo "❌ **Python Dependencies**: Audit failed to run" >> $GITHUB_STEP_SUMMARY
        else
          echo "⏭️ **Python Dependencies**: Skipped" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ needs.renovate-check.result }}" == "success" ]; then
          echo "✅ **Renovate Configuration**: Valid" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Renovate Configuration**: Check required" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🛡️ Dependency Security Active:" >> $GITHUB_STEP_SUMMARY
        echo "- Python vulnerability scanning (pip-audit)" >> $GITHUB_STEP_SUMMARY
        echo "- Renovate automated dependency updates" >> $GITHUB_STEP_SUMMARY
        echo "- Pull request dependency review" >> $GITHUB_STEP_SUMMARY
